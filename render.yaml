# Render Blueprint — No-Leak-MCP durable plane: a web service + a background worker + a persistent disk.
# NOTE: this is Render *hosting*. It does NOT use the Render Workflows product (the Workflows challenge's required tech).
# Deploy: push repo to GitHub, then Render → New → Blueprint → pick this repo.
# CONVEX_URL is set here, not in the dashboard: it is a public endpoint, not a
# secret (the dashboard HTML ships it to every visitor), so version-controlling it
# removes a manual step and a way to get the two services pointing at different
# deployments. NEBIUS_API_KEY and NOLEAK_SECRET stay sync:false -- those are real.
services:
  - type: web
    name: noleak-collector
    runtime: node
    rootDir: render
    plan: starter
    buildCommand: npm install
    startCommand: node collector/server.mjs
    healthCheckPath: /health
    disk:
      name: noleak-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: INGEST_TOKEN
        generateValue: true   # shared secret; write endpoints require x-noleak-token

  - type: worker
    name: noleak-detection-worker
    runtime: node
    rootDir: render
    plan: starter
    buildCommand: npm install
    startCommand: node worker/worker.mjs
    envVars:
      - key: COLLECTOR_URL
        fromService:
          type: web
          name: noleak-collector
          property: hostport   # host:port on Render's private network; the worker prepends http:// (see worker.mjs)
      - key: INGEST_TOKEN
        fromService:
          type: web
          name: noleak-collector
          envVarKey: INGEST_TOKEN
      - key: CONVEX_URL
        value: https://wary-herring-602.convex.cloud   # production; public endpoint, not a secret

  # THE PUBLIC SERVICE. This one alone serves everything a judge opens:
  #   /           the website          /arena      the judge-runnable arena
  #   /dashboard  the live feed        /c/:id      the attacker drop the verdict checks
  # rootDir is deliberately omitted so it builds from the REPO ROOT and can import
  # plugins/* directly — the REAL detector functions, not copies of them.
  #
  # buildCommand is explicit and empty ON PURPOSE. Render's node runtime defaults to
  # `npm install`, and the repo root has no package.json (the arena has zero deps),
  # so the default would fail the build with ENOENT. Verified: `npm install` in a
  # directory without a package.json errors. Do not delete this line to "tidy up".
  - type: web
    name: noleak-arena
    runtime: node
    plan: starter
    buildCommand: "echo 'no build: the arena has zero dependencies'"
    startCommand: node render/arena/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"   # the arena needs 18+; pin it rather than inherit Render's default
      - key: NEBIUS_API_KEY
        sync: false   # victim + scorer inference (paste in the Render dashboard)
      - key: CONVEX_URL
        value: https://wary-herring-602.convex.cloud   # the same feed the dashboard reads
      - key: NOLEAK_SECRET
        sync: false   # gates the admin reset-limits endpoint
      - key: LINKUP_API_KEY
        sync: false   # Deep Research: "where were the keys being sent". A real secret,
                      # unlike CONVEX_URL above, so it is pasted in the dashboard.
                      # Absent = the arena runs exactly as before, minus one step.
      - key: COLLECTOR_URL
        fromService:
          type: web
          name: noleak-collector
          property: hostport   # durable drop + event ingress on the private network
      - key: INGEST_TOKEN
        fromService:
          type: web
          name: noleak-collector
          envVarKey: INGEST_TOKEN
      # ARENA_PUBLIC_URL is deliberately NOT set here. Render's `property: host`
      # returns the bare service name ("noleak-arena-n14r"), not the FQDN, and it
      # would shadow RENDER_EXTERNAL_URL, which Render sets automatically on every
      # web service and which IS the full https URL. The drop the victim fetches is
      # built from this base, so a bare name means the fetch never resolves and a
      # guard-off run can never be shown to leak. Leaving it unset is the fix.
