# Render Blueprint — No-Leak-MCP durable plane: a web service + a background worker + a persistent disk.
# NOTE: this is Render *hosting*. It does NOT use the Render Workflows product (the Workflows challenge's required tech).
# Deploy: push repo to GitHub, then Render → New → Blueprint → pick this repo.
# Set CONVEX_URL on the worker (from your Convex deployment) in the dashboard.
services:
  - type: web
    name: noleak-collector
    runtime: node
    rootDir: render
    plan: starter
    buildCommand: npm install
    startCommand: node collector/server.mjs
    healthCheckPath: /health
    disk:
      name: noleak-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: INGEST_TOKEN
        generateValue: true   # shared secret; write endpoints require x-noleak-token

  - type: worker
    name: noleak-detection-worker
    runtime: node
    rootDir: render
    plan: starter
    buildCommand: npm install
    startCommand: node worker/worker.mjs
    envVars:
      - key: COLLECTOR_URL
        fromService:
          type: web
          name: noleak-collector
          property: hostport   # host:port on Render's private network; the worker prepends http:// (see worker.mjs)
      - key: INGEST_TOKEN
        fromService:
          type: web
          name: noleak-collector
          envVarKey: INGEST_TOKEN
      - key: CONVEX_URL
        sync: false   # paste your Convex deployment URL in the Render dashboard

  # The public, judge-runnable ARENA. Node web service, rootDir = REPO ROOT
  # (rootDir omitted) so it can import plugins/* directly — the REAL detector
  # functions, not copies. Zero deps → no buildCommand. Simulated Slack surface +
  # simulated agent loop, real detectors, real Nebius victim model. Not dsh.
  - type: web
    name: noleak-arena
    runtime: node
    plan: starter
    startCommand: node render/arena/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false   # victim + scorer inference (paste in the Render dashboard)
      - key: CONVEX_URL
        sync: false   # shared live feed (same deployment the dashboard reads)
      - key: NOLEAK_SECRET
        sync: false   # gates the admin reset-limits endpoint
      - key: COLLECTOR_URL
        fromService:
          type: web
          name: noleak-collector
          property: hostport   # durable drop + event ingress on the private network
      - key: INGEST_TOKEN
        fromService:
          type: web
          name: noleak-collector
          envVarKey: INGEST_TOKEN
      - key: ARENA_PUBLIC_URL
        fromService:
          type: web
          name: noleak-arena
          property: host   # public hostname; used to build the verifiable drop URL
